# Merge into the existing TLS vhost only after the parent coordinates cutover.
# Preserve Host, Authorization and raw event bodies. No URI prefix reaches the app.
location = /slack/mcp {
    proxy_pass http://127.0.0.1:8002/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 256k;
}
location = /slack/events {
    proxy_pass http://127.0.0.1:8002/events;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    client_max_body_size 192k;
}
